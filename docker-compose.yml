services:
  mirofish:
    image: ghcr.io/666ghj/mirofish:latest
    # 加速镜像（如拉取缓慢可替换上方地址）
    # image: ghcr.nju.edu.cn/666ghj/mirofish:latest
    container_name: mirofish
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads

  # 10GB 開發機預設 4-bit AWQ。16GB BF16：LOCAL_LLM_MODEL=Qwen/Qwen3.5-4B
  local-llm:
    image: vllm/vllm-openai:latest
    profiles: ["local"]
    ports:
      - "8000:8000"
    ipc: host
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --model
      - ${LOCAL_LLM_MODEL:-SubSir/Qwen3.5-4B-AWQ}
      - --enable-prefix-caching
      - --max-logprobs
      - "64"
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - ${LOCAL_LLM_GPU_MEMORY_UTILIZATION:-0.90}
      - --max-num-seqs
      - "32"

  local-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.1
    profiles: ["local"]
    ports:
      - "8001:80"
    volumes:
      - embed-cache:/data
    command:
      - --model-id
      - ${LOCAL_EMBED_MODEL:-intfloat/multilingual-e5-small}
      - --port
      - "80"

volumes:
  hf-cache:
  embed-cache: